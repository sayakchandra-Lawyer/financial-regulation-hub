<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#FAF9F5;--surface:#FFFFFF;--ink:#141413;--ink-2:#5E5D59;--line:#E8E6DC;--accent:#C15F3C;--accent-ink:#FFFDF9}
@media (prefers-color-scheme:dark){:root{--bg:#1F1E1D;--surface:#262624;--ink:#FAF9F5;--ink-2:#C2C0B6;--line:#3B3A37;--accent:#D97757;--accent-ink:#1F1E1D}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
main{max-width:520px;text-align:center}
.logo{width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 18px}
h1{font:500 32px/1.2 "Source Serif 4",Georgia,serif;margin:0 0 10px}
p{color:var(--ink-2);margin:0 0 22px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a.b{display:inline-block;padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
a.b.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
</style>
</head>
<body>
<main>
  <div class="logo"><svg width="40" height="40" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="16" r="14" stroke-width="1.6" opacity=".9"/><circle cx="16" cy="16" r="11.6" stroke-width=".9" stroke-dasharray="1.2 2" opacity=".7"/><path transform="translate(5.8 5.4) scale(.85)" stroke-width="2.4" d="M6 4.5h12M6 9h12M8.5 4.5h1.5a4.5 4.5 0 0 1 0 9H6.5l7.5 7"/></svg></div>
  <h1>This page does not exist</h1>
  <p>The link may be old or mistyped. Start again from the home page, or go straight to a regulator.</p>
  <div class="row" id="links"><a class="b p" href="/">Go to the home page</a></div>
</main>
<script>
/* the site may sit under a folder (GitHub Pages project site) or at a domain root */
(function(){
  var seg = location.pathname.split("/")[1] || "";
  var base = /\.github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
  var L = [["", "Go to the home page"], ["rbi/", "RBI"], ["sebi/", "SEBI"], ["irdai/", "IRDAI"], ["fema/", "FEMA"], ["judgments/", "Judgments"]];
  document.getElementById("links").innerHTML = L.map(function(x, i){ return '<a class="b' + (i ? '' : ' p') + '" href="' + base + x[0] + '">' + x[1] + '</a>'; }).join("");
})();
</script>
</body>
</html>
