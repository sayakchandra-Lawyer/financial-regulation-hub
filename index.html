<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Financial Regulation Hub</title>
<meta name="description" content="Financial regulatory information for finance professionals: RBI, SEBI and IRDAI rules, key court rulings and other regulators, organised by task, with obligations, deadlines and consequences linked to the official text.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="assets/hub.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C15F3C'/%3E%3Cpath d='M16 6v20M6 16h20M9 9l14 14M23 9 9 23' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
<style>
.hero{background:linear-gradient(180deg,var(--surface-2),var(--bg));border-bottom:1px solid var(--line)}
.hero .in{max-width:920px;margin:0 auto;padding:64px 16px 46px;text-align:center}
.hero h1{font-size:clamp(32px,5vw,50px);line-height:1.1;margin:14px 0 24px}
.hero .lede{color:var(--ink-2);font-size:16.5px;max-width:680px;margin:-8px auto 26px}
.lens{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;align-items:center}
.lens label{font-size:13px;color:var(--ink-2)}
#results{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.rhead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
.rhead b{color:var(--ink)}
.meaning{padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:48px 0 16px}.sec-h h2{font-size:26px}
.upd{padding:18px;display:block;transition:border-color .18s}.upd:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}.upd:active{background:var(--surface-2)}
.upd .m{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.stat{font:500 26px var(--f-d)}
</style>
</head>
<body>
<header id="top"></header>
<main>
  <section class="hero"><div class="in">
    <h1 class="rise" style="animation-delay:.05s">What do you need to know today?</h1>
    <p class="lede rise" style="animation-delay:.1s">Plain-language summaries of the rules that bind NBFCs, HFCs, insurers and insurance distributors: obligations, deadlines and consequences of breach, each linked to the official text.</p>
    <form class="search rise" style="animation-delay:.15s" id="qform" role="search">
      <span id="qicon"></span><label class="sr" for="q">Search</label>
      <input id="q" type="search" autocomplete="off" placeholder="Ask a question or search, e.g. “minimum retention for securitisation”">
      <span class="kbd">/</span>
    </form>
    <div class="lens rise" style="animation-delay:.2s">
      <label for="layer">I am a:</label>
      <select class="chip" id="layer" aria-label="Who you are">
        <optgroup label="RBI"><option value="-1">NBFC, any layer</option><option value="0">NBFC in the Base Layer</option><option value="1">NBFC in the Middle Layer</option><option value="2">NBFC in the Upper Layer</option><option value="3">NBFC in the Top Layer</option></optgroup>
        <optgroup label="Insurance"><option value="i-1">Insurer or distributor, any role</option><option value="i0">Life insurer</option><option value="i1">Health insurer</option><option value="i2">Corporate agent</option><option value="i3">Individual agent</option></optgroup>
      </select>
      <span class="tag" id="lensnote"></span>
    </div>
    <div class="results" id="results" hidden></div>
  </div></section>

  <div class="wrap">
    <div class="sec-h"><h2>Start with a task</h2></div>
    <div class="grid g3" id="tasks"></div>

    <div class="sec-h"><h2>Browse by regulator</h2></div>
    <div class="grid g5" id="regs"></div>

    <div class="sec-h"><h2 id="updh">What changed this week</h2><span class="tag" id="updwin"></span><a class="tag lnk" id="updall" style="margin-left:auto" href="rbi/#changes">See all changes</a></div>
    <div class="grid g3" id="upds"></div>

  </div>
</main>
<footer id="foot"></footer>
<script src="assets/hub.js"></script>
<script>
(async function(){
  const hub = await getJSON("hub.json");
  renderChrome(hub, { root: "" });
  $("#qicon").outerHTML = I.search;
  const secs = { rbi: hub.sections.find(s => s.id === "rbi"), irdai: hub.sections.find(s => s.id === "irdai" && s.status === "live") };
  const MS = {};
  await Promise.all(Object.entries(secs).map(async ([k, s]) => { if (!s) return; try { MS[k] = await loadSection(s, ""); } catch (e) { console.warn(e); } }));
  const NAME = { rbi: "RBI", irdai: "IRDAI" };
  const lay = $("#layer");
  const saved = store.get("layer", "-1"); lay.value = [...lay.options].some(o => o.value === saved) ? saved : "-1";
  const K = () => lay.value.startsWith("i") && MS.irdai ? "irdai" : "rbi";      // which regulator the lens points to
  const L = () => +lay.value.replace(/^i/, "");
  const M = () => MS[K()];
  const unit = () => K() === "irdai" ? "role" : "layer";
  function lensNote(){
    const m = M(); if (!m) return;
    const n = m.items.filter(it => appliesAt(m, it, L())).length;
    $("#lensnote").textContent = L() < 0 ? "" : `${n} ${NAME[K()]} instruments apply to you`;
  }
  function judge(){
    if (!hub.ai_endpoint || !M()) return;
    const k = K(), s = secs[k];
    initJudge(Object.assign({ M: M(), endpoint: hub.ai_endpoint, fulltext: s.data.fulltext, link: id => `${s.href}#d/` + id, wide: true }, k === "irdai"
      ? { section: "irdai", docs: "the insurance texts", scope: "Answers from the insurance texts on this site",
          intro: "Put your question on insurance law for insurers, agents and corporate agents, and I shall answer from the Acts, Regulations and Master Circulars on this site, citing the provision. Check what I say.",
          tries: [["What is the free look period for a life policy?", "Free look period"], ["How quickly must a cashless claim be authorised?", "Cashless claim timelines"], ["With how many insurers can a corporate agent tie up?", "Corporate agent tie-ups"]],
          placeholder: "Ask a question, e.g. How long is the moratorium on health claims?" }
      : { section: "rbi", scope: "Answers from the RBI texts on this site" }));
  }
  lay.addEventListener("change", () => {
    store.set("layer", lay.value);
    if (K() === "irdai") store.set("irdai.lens", String(L()));
    lensNote(); renderTasks(); renderUpdates(); judge(); if ($("#q").value.trim()) runSearch();
  });

  /* tasks */
  const TI = {
    new:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="3"/>', cal:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    def:'<path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M9 9h6M9 13h4"/>', pen:'<path d="M12 3 2.5 20h19z"/><path d="M12 10v4M12 17v.5"/>',
    who:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/>', jud:'<path d="M12 4v16M7 20h10M5 7h14"/><path d="m5 7-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z"/>'
  };
  function renderTasks(){
    const m = M(), k = K(), h = secs[k].href;
    const live = m ? m.items.filter(it => appliesAt(m, it, L())) : [];
    const nT = live.reduce((a, it) => a + it.time.length, 0), nC = live.filter(it => it.cons.length).length;
    const nU = m ? m.updates.length : 0;
    const tasks = [
      [k === "irdai" ? "What changed recently" : "What changed this week", nU ? `${nU} new item${nU>1?"s":""} from ${NAME[k]}, with what each one means` : "New circulars and amendments, explained", "new", `${h}#changes`],
      ["Compliance calendar", `${nT} timelines across ${live.filter(it=>it.time.length).length} ${NAME[k]} instruments${L()>=0?` for your ${unit()}`:""}`, "cal", `${h}#calendar`],
      ["Look up a defined term", m ? `${m.defs.length.toLocaleString("en-IN")} ${NAME[k]} definitions, each with the provision that governs` : "Defined terms with their paragraph", "def", `${h}#definitions`],
      ["Penalties and consequences", `What a breach can cost: ${nC} ${NAME[k]} instruments state their own consequences`, "pen", `${h}#penalties`],
      ["Does this apply to me?", `Pick your ${unit()} and see only the rules that bind you`, "who", `${h}#who`],
      ["Court rulings on a point", "Supreme Court and High Court holdings since 2010", "jud", ""]
    ];
    $("#tasks").innerHTML = tasks.map(([t, s, ic, href], i) => `<a class="card tk rise" style="animation-delay:${.05*i}s" ${href?`href="${href}"`:`aria-disabled="true"`}>
      <span class="ti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">${TI[ic]}</svg></span>
      <span><span style="display:block;font-weight:600">${esc(t)}${href?"":' <span class="pill p-soon" style="margin-left:4px">Coming soon</span>'}</span><span class="tag" style="display:block;margin-top:2px">${esc(s)}</span></span>
      ${href?`<span class="ar">${I.arrow}</span>`:""}</a>`).join("");
  }

  /* updates: follow the lens (RBI weekly, IRDAI recent) */
  function renderUpdates(){
    const m = M(), k = K(), h = secs[k].href;
    $("#updh").textContent = k === "irdai" ? "What changed recently in insurance" : "What changed this week";
    $("#updall").setAttribute("href", `${h}#changes`); $("#updwin").textContent = "";
    if (!m || !m.updates.length) { $("#upds").innerHTML = `<p class="tag">No new items recorded this week.</p>`; return; }
    const w = m.updMeta; if (w.window_from && k === "rbi") $("#updwin").textContent = `${fmtDate(w.window_from,false)} – ${fmtDate(w.window_to)}`;
    $("#upds").innerHTML = m.updates.slice(0, 3).map((u, i) => {
      const it = m.byId.get(u.instrument);
      return `<a class="card upd rise" style="--c:var(--${k});animation-delay:${.05*i}s" href="${h}#changes/${encodeURIComponent(u.id)}">
        <div class="m"><span class="dot"></span><b style="color:var(--ink-2)">${NAME[k]}</b><span style="white-space:nowrap">· ${esc(trunc(u.kind, 28))}</span><span style="margin-left:auto;white-space:nowrap">${fmtDate(u.date,false)}</span></div>
        <div style="font-weight:600;margin:10px 0 6px;line-height:1.4">${esc(trunc(u.title, 120))}</div>
        <div class="tag">${u.effective ? `Effective ${fmtDate(u.effective)}` : ""}${u.effective && it ? '<span class="sep"></span>' : ""}${it ? esc(it.label) : ""}</div></a>`;
    }).join("");
  }

  /* regulator cards */
  function renderRegs(){
    $("#regs").innerHTML = hub.sections.map((s, i) => {
      const live = s.status === "live", m = MS[s.id];
      const cnt = !m ? 0 : s.id === "rbi" ? m.items.filter(x=>x.type==="Master Direction"&&x.sc!=="old").length : m.items.filter(x=>/^Regulation/.test(x.type)&&x.sc!=="old").length;
      const stat = live && m ? `<span class="pill p-live"><span data-count="${cnt}">0</span> ${s.id === "rbi" ? "Directions" : "Regulations"}</span>` : `<span class="pill p-soon">In preparation</span>`;
      return `<${live?"a":"div"} class="card rc rise ${live?"":"soon"}" id="${s.id}" style="--c:var(--${s.id});animation-delay:${.06*i}s" ${live?`href="${s.href}"`:""}>
        <span class="ic">${I[s.id]}</span><h3 style="font-size:21px;margin-top:16px">${esc(s.name)}</h3><div class="tag" style="margin-top:2px">${esc(s.full)}</div>
        <p style="font-size:13.5px;color:var(--ink-2);margin:10px 0 0">${esc(s.desc)}</p>
        <div style="margin-top:auto;padding-top:16px;display:flex;align-items:center;gap:8px">${stat}${live?`<span class="go">${I.arrow}</span>`:""}</div></${live?"a":"div"}>`;
    }).join("");
    $$("[data-count]").forEach(el => countUp(el, +el.dataset.count));
  }

  /* search: both live regulators, the one your lens points to first */
  let tmr = 0;
  function block(k, raw){
    const m = MS[k]; if (!m) return "";
    const h = secs[k].href, lens = K() === k && L() >= 0 ? L() : undefined;
    const P = parseQuery(m, raw), docs = rankDocs(m, P, { layer: lens }).slice(0, K() === k ? 6 : 3), defs = matchDefs(m, P).slice(0, K() === k ? 3 : 1);
    if (!docs.length && !defs.length && K() !== k) return "";
    let s = `<div class="rhead"><b>${NAME[k]}</b><span>${docs.length ? `Top ${docs.length} instruments` : "No instrument matches"}${lens !== undefined ? ` for your ${unit()}` : ""}</span><a class="lnk" style="margin-left:auto" href="${h}#search/${encodeURIComponent(raw)}">All results →</a></div>`;
    if (P.gl.length) s += `<div class="meaning"><b>${esc(P.gl[0].term)}</b>${P.gl[0].full?` (${esc(P.gl[0].full)})`:""}: ${esc(P.gl[0].def)}</div>`;
    s += defs.map(x => `<a class="res" href="${h}#d/${x.d.id}/definitions"><div class="t">“${esc(x.d.term)}” <span class="pill p-grey" style="margin-left:6px">Definition</span></div><div class="m">${esc(x.it?x.it.label:x.d.id)} · ${esc(x.d.para)}</div><div class="s">${hl(trunc(x.d.def, 220), P)}</div></a>`).join("");
    s += docs.map(d => { const l = d.hits.find(x => x.lab !== "Name") || d.hits[0];
      return `<a class="res" href="${h}#d/${d.it.id}"><div style="display:flex;align-items:center;gap:12px"><div style="flex:1;min-width:0"><div class="t">${hl(d.it.label, P)} ${d.it.sc==="old"?'<span class="pill p-old">Superseded</span>':""}</div><div class="m">${esc(d.it.type)} · ${esc(m.themeOf.get(d.it.id)?.nice||"")}</div></div><span class="bar" title="Relevance"><i style="width:${Math.round(d.rel*100)}%"></i></span></div>${l?`<div class="s"><b style="font-weight:600">${esc(l.lab)}:</b> ${hl(trunc(l.txt, 220), P)}</div>`:""}</a>`; }).join("");
    return s;
  }
  function runSearch(){
    const raw = $("#q").value.trim(), box = $("#results");
    if (raw.length < 2 || !M()) { box.hidden = true; return; }
    const order = K() === "irdai" ? ["irdai", "rbi"] : ["rbi", "irdai"];
    let h = order.map(k => block(k, raw)).join("");
    h += `<div class="rhead" style="justify-content:space-between"><span>SEBI and court rulings become searchable as each section goes live.</span>${hub.ai_endpoint?`<button class="lnk" type="button" id="askai">Ask Not So Intelligent AI →</button>`:""}</div>`;
    box.innerHTML = h; box.hidden = false;
    const a = $("#askai"); if (a) a.addEventListener("click", () => openJudge(raw));
  }
  $("#q").addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(runSearch, 160); });
  $("#qform").addEventListener("submit", e => { e.preventDefault(); const raw = $("#q").value.trim(); if (raw) location.href = `${secs[K()].href}#search/` + encodeURIComponent(raw); });

  renderTasks(); renderUpdates(); renderRegs(); lensNote(); judge();
  if (MS.rbi) $("#asof").textContent = `RBI register as on ${fmtDate(MS.rbi.meta.as_of)}${MS.irdai ? ` · IRDAI as on ${fmtDate(MS.irdai.meta.as_of)}` : ""}`;
})();
</script>
</body>
</html>
