<style>

<body>
<header id="top"></header>
<main class="wrap">
  <section class="hero">
    <div class="eyebrow">All regulators</div>
    <h1>What applies to my entity</h1>
    <p>Pick what your company is, what it holds and what it does. See every Act, rule and direction that binds it, across regulators, and why.</p>
    <div class="presets" id="presets"></div>
  </section>
  <div class="eb">
    <aside class="card bld" id="bld" aria-label="Build your entity"></aside>
    <section class="card res" aria-label="What applies">
      <div class="rhead" id="rhead"></div>
      <div class="ebar" id="ebar"></div>
      <div id="out"></div>
    </section>
  </div>
</main>
<footer id="foot"></footer>
<script src="../assets/entity-engine.js?v=20261128x"></script>
<script src="../assets/hub.js?v=20261128x"></script>
<script>
(async function(){
  const hub = await getJSON("../hub.json");
  renderChrome(hub, { root: "../", active: "entity", sub: "What applies to my entity", crumb: `<a href="../">Home</a> / <b>My entity</b>` });
  const D = await getJSON("data/entity.json");
  $("#asof").textContent = D.meta.as_of ? `Registers as on ${fmtDate(D.meta.as_of)}` : "";
  const A = new Map(D.attrs.map(a => [a.id, a]));
  const SEC = new Map(D.sections.map(s => [s.id, s]));
  const COL = id => ({ lender: "var(--rbi)", combo: "var(--accent)", rulings: "var(--jud)" })[id] || `var(--${id})`;
  const LIDX = Object.fromEntries(D.layers.map((l, i) => [l.cat, i]));
  const LBYID = Object.fromEntries(D.layers.map((l, i) => [l.id, i]));
  const SECTOR = { lending: "Lending", hfc: "Housing finance", life: "Life insurance", health: "Health insurance", broking: "Broking", mf: "Mutual funds" };
  const short = (s, n) => s.length > n ? s.slice(0, n - 1).trim() + "…" : s;
  const phone = () => matchMedia("(max-width:900px)").matches;

  /* ---------- state: selection in the hash (#e=icc,ml,debt), view in local storage ---------- */
  let sel = new Set(), view = store.get("entity.view", "") || (phone() ? "list" : "map"), open = new Set(), panel = null, seen = new Set(), T = null;
  function readHash(){
    const m = /(?:^|&)e=([\w,-]*)/.exec(location.hash.slice(1));
    sel = new Set((m ? m[1].split(",") : []).filter(x => A.has(x)));
    tidy();
  }
  function writeHash(){ const h = sel.size ? "#e=" + [...sel].join(",") : " "; history.replaceState(null, "", h === " " ? location.pathname + location.search : h); }
  const typeOf = () => [...sel].map(x => A.get(x)).find(a => a.group === "type");
  function tidy(){
    const t = typeOf();
    for (const g of D.groups.filter(g => g.single)) { const on = [...sel].filter(x => A.get(x).group === g.id); on.slice(0, -1).forEach(x => sel.delete(x)); }
    const lay = [...sel].find(x => A.get(x).group === "layer");
    if (!t || !t.layers.length) { if (lay) sel.delete(lay); }
    else if (lay && !t.layers.includes(lay)) sel.delete(lay);
    if (t && t.layers.length && ![...sel].some(x => A.get(x).group === "layer")) sel.add(t.layers[0]);
  }

  /* ---------- the engine: selection -> instruments, each with its reasons ---------- */
  const computeFor = entityEngine(D);
  function compute(){ return computeFor(sel); }

  /* ---------- builder ---------- */
  /* saved entities first (this browser only), then the examples */
  function renderPresets(){
    const mine = Profiles.all(), cur = [...sel].join();
    $("#presets").innerHTML = (mine.length ? `<div class="mine"><span class="tag">Your saved entities:</span>${mine.map(p => `<span class="chip pchip ${p.sel.join() === cur ? "on" : ""}"><button type="button" data-prof="${esc(p.id)}">${esc(p.name)}</button><button type="button" class="px" data-pdel="${esc(p.id)}" aria-label="Delete ${esc(p.name)}" title="Delete">×</button></span>`).join("")}<a class="lnk" style="font-size:13px" href="../dashboard/">Open my dashboard</a></div>` : "")
      + `<div><span class="tag">Start from an example:</span>` + D.presets.map((p, i) => `<button type="button" class="chip ${p.sel.join() === cur ? "on" : ""}" data-preset="${i}">${esc(p.label)}</button>`).join("") + `</div>`;
  }
  renderPresets();
  const TIPDEF = { type: "Not sure? Most lending NBFCs, including large diversified lenders, are NBFC (Investment and Credit). Point at a type to see what it covers.",
    layer: "Point at a layer to see who falls in it." };
  function tipFor(g, hover){ const a = hover ? A.get(hover) : D.attrs.find(x => x.group === g && sel.has(x.id)); return (a && a.tip) || TIPDEF[g]; }
  function showTip(b){ const a = b && A.get(b.dataset.a); if (!a || !TIPDEF[a.group]) return; const p = $(`#bld .tip[data-g="${a.group}"]`); if (p) p.textContent = tipFor(a.group, a.id); }
  function resetTip(b){ const a = b && A.get(b.dataset.a); if (!a || !TIPDEF[a.group]) return; const p = $(`#bld .tip[data-g="${a.group}"]`); if (p) p.textContent = tipFor(a.group); }
  function renderBuilder(){
    const t = typeOf();
    $("#bld").innerHTML = D.groups.map(g => {
      const opts = D.attrs.filter(a => a.group === g.id);
      if (g.id === "layer" && !(t && t.layers.length)) return `<div class="grp"><h3>${esc(g.label)}<i>${esc(g.hint)}</i></h3><p class="help" style="margin:0">${t ? "Not used for this type." : "Pick an NBFC or HFC type first."}</p></div>`;
      return `<div class="grp" role="group" aria-label="${esc(g.label)}"><h3>${esc(g.label)}${g.hint ? `<i>${esc(g.hint)}</i>` : ""}</h3><div class="chips">${opts.map(a => {
        const dis = g.id === "layer" && !t.layers.includes(a.id);
        return `<button type="button" class="chip ${g.id === "role" ? "role" : ""} ${sel.has(a.id) ? "on" : ""}" data-a="${a.id}" aria-pressed="${sel.has(a.id)}" ${dis ? 'aria-disabled="true"' : ""}${a.tip ? ` title="${esc(a.tip)}"` : ""}>${esc(a.label)}</button>`; }).join("")}</div>${TIPDEF[g.id] ? `<p class="help tip" data-g="${g.id}" aria-live="polite">${esc(tipFor(g.id))}</p>` : ""}${g.help ? `<p class="help">${esc(g.help)}</p>` : ""}</div>`;
    }).join("") + `<div class="bfoot">${sel.size ? `<button type="button" class="btn g" id="psave" style="font-size:13px">Save this entity</button>` : ""}<button type="button" class="btn g" id="copy" style="font-size:13px">Copy link to this entity</button><button type="button" class="lnk" id="clear" style="font-size:13px">Clear</button><span class="tag" id="copied" aria-live="polite"></span></div>`;
    renderPresets();
  }
  $("#bld").addEventListener("mouseover", e => showTip(e.target.closest(".chip[data-a]")));
  $("#bld").addEventListener("mouseout", e => resetTip(e.target.closest(".chip[data-a]")));
  $("#bld").addEventListener("focusin", e => showTip(e.target.closest(".chip[data-a]")));
  $("#bld").addEventListener("focusout", e => resetTip(e.target.closest(".chip[data-a]")));
  $("#bld").addEventListener("click", e => {
    const b = e.target.closest("[data-a]");
    if (b) {
      if (b.getAttribute("aria-disabled") === "true") return;
      const a = A.get(b.dataset.a), g = D.groups.find(x => x.id === a.group);
      if (sel.has(a.id)) { if (a.group !== "layer") sel.delete(a.id); }
      else { if (g.single) [...sel].filter(x => A.get(x).group === g.id).forEach(x => sel.delete(x)); sel.add(a.id); }
      tidy(); panel = null; update(); return;
    }
    if (e.target.closest("#clear")) { sel.clear(); open.clear(); panel = null; update(); }
    if (e.target.closest("#psave")) {
      const f = $("#bld .bfoot"), guess = [...sel].map(x => A.get(x).short || A.get(x).label).slice(0, 3).join(" · ");
      f.innerHTML = `<label class="sr" for="pname">Name for this entity</label><input id="pname" class="chip" style="flex:1;min-width:180px;font-size:13px;padding:7px 12px;cursor:text" maxlength="60" value="${esc(guess)}" placeholder="e.g. Housing finance arm"><button type="button" class="btn p" id="pok" style="font-size:13px">Save</button><button type="button" class="lnk" id="pcancel" style="font-size:13px">Cancel</button><span class="tag" style="width:100%">Saved only in this browser, on this device. The dashboard can save a copy to a file.</span>`;
      const i = $("#pname"); i.focus(); i.select();
      i.addEventListener("keydown", ev => { if (ev.key === "Enter") $("#pok").click(); if (ev.key === "Escape") $("#pcancel").click(); });
      return;
    }
    if (e.target.closest("#pok")) { const n = $("#pname").value.trim(); if (n) { Profiles.add(n, [...sel]); update(); } return; }
    if (e.target.closest("#pcancel")) { renderBuilder(); return; }
    if (e.target.closest("#copy")) { const u = location.href; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => $("#copied").textContent = "Link copied", () => $("#copied").textContent = u); }
  });
  $("#presets").addEventListener("click", e => {
    const d = e.target.closest("[data-pdel]"); if (d) { Profiles.drop(d.dataset.pdel); renderPresets(); return; }
    const pr = e.target.closest("[data-prof]"); if (pr) { const p = Profiles.get(pr.dataset.prof); if (p) { sel = new Set(p.sel.filter(x => A.has(x))); tidy(); open.clear(); panel = null; update(); } return; }
    const b = e.target.closest("[data-preset]"); if (!b) return; sel = new Set(D.presets[+b.dataset.preset].sel); tidy(); open.clear(); panel = null; update(); });
  $("#ebar").addEventListener("click", e => { if (e.target.closest("#editent")) { $("#bld").classList.toggle("fold"); if (!$("#bld").classList.contains("fold")) $("#bld").scrollIntoView({ behavior: "smooth" }); } });

  /* ---------- result shape: branches for the map and the list ---------- */
  function branches(R){
    const out = [];
    const pref = ["rbi", "nhb", "sebi", "exchanges", "irdai", "companies", "fema", "dpdp", "ibc", "ifsc"];
    const order = [...pref, ...[...SEC.keys()].filter(k => !pref.includes(k))];
    if (R.combos.length) out.push({ id: "combo", name: "Your combination", themes: R.combos.map(c => ({ name: c.title, combo: c, items: R.items.filter(i => i.combos.includes(c.id)) })) });
    for (const s of order) {
      const its = R.items.filter(i => i.sec === s); if (!its.length) continue;
      const th = new Map(); its.forEach(i => { if (!th.has(i.theme)) th.set(i.theme, []); th.get(i.theme).push(i); });
      out.push({ id: s, name: SEC.get(s).short, count: its.length, themes: [...th].map(([name, items]) => ({ name, items })) });
    }
    const via = R.items.filter(i => i.sec === "lender");
    if (via.length) { const g = new Map(); via.forEach(i => { const a = A.get(i.via); if (!g.has(a.id)) g.set(a.id, { name: "If you act as: " + a.label, items: [] }); g.get(a.id).items.push(i); }); out.splice(R.combos.length ? 1 : 0, 0, { id: "lender", name: "RBI, via your lender", count: via.length, via: true, themes: [...g.values()] }); }
    if (R.rulings.length) { const g = new Map(); R.rulings.forEach(j => { const s = j.sectors.find(x => SECTOR[x]) || "lending"; if (!g.has(s)) g.set(s, { name: SECTOR[s], items: [] }); g.get(s).items.push({ k: "j:" + j.id, ruling: j, name: j.title, sec: "rulings" }); }); out.push({ id: "rulings", name: "Key rulings", count: R.rulings.length, themes: [...g.values()] }); }
    return out;
  }
  const whyText = i => [...i.why].join("; ");
  const TIER = { direct: ["Applies directly", "t-dir"], part: ["Applies in part", "t-part"], cond: ["If you take up this activity", "t-cond"], event: ["Applies on a transaction or event", "t-evt"], prop: ["Proposed, not yet law", "t-evt"], via: ["Through your lender", "t-via"] };
  /* a pill only where the entry is not a plain "applies directly"; "in part" already shows its scope line */
  const tierPill = (i, all) => i.tier && TIER[i.tier] && (all || !["direct", "part", "via"].includes(i.tier)) ? `<span class="pill tier ${TIER[i.tier][1]}">${TIER[i.tier][0]}</span>` : "";
  const hrefOf = i => i.ruling ? `../judgments/#j/${encodeURIComponent(i.ruling.id)}` : `../${SEC.get(i.home).href}#d/${encodeURIComponent(i.id)}`;
  const HIDE = { sebi: "a listing", exchanges: "a listing", irdai: "IRDAI corporate agent", fema: "“Borrows abroad or lends to non-residents”", ifsc: "IFSC unit", ibc: "an NBFC or HFC type", dpdp: "an NBFC or HFC type, a licence or a role", rbi: "an NBFC or HFC type" };

  /* ---------- header, entity bar and view switch ---------- */
  function renderHead(R, B){
    const direct = R.items.filter(i => i.sec !== "lender"), regs = new Set(direct.map(i => i.home));
    const nT = t => direct.filter(i => i.tier === t).length;
    $("#rhead").innerHTML = `<div class="stat" title="Bind an entity like yours without any further condition"><b>${nT("direct")}</b><span>apply directly</span></div>${nT("part") ? `<div class="stat" title="Only the paragraphs named apply, or only if a stated condition is met"><b>${nT("part")}</b><span>apply in part</span></div>` : ""}${nT("cond") ? `<div class="stat" title="Apply only if you take up an activity or licence you have not picked"><b>${nT("cond")}</b><span>if you take up an activity</span></div>` : ""}${nT("event") ? `<div class="stat" title="Contract, stamp, security, recovery and insolvency laws: they apply when you sign, take or enforce security, recover dues, or when a borrower or your company enters insolvency"><b>${nT("event")}</b><span>on a transaction or event</span></div>` : ""}<div class="stat"><b>${regs.size}</b><span>regulators</span></div><div class="stat"><b>${R.combos.length}</b><span>extra rules from your combination</span></div>${R.items.some(i => i.via) ? `<div class="stat"><b>${R.items.filter(i => i.via).length}</b><span>via your lender</span></div>` : ""}<div class="sp"></div>
      <div class="seg" role="group" aria-label="View">${[["map", "Mind map"], ["list", "List"], ["dl", "Deadlines"]].map(([k, l]) => `<button type="button" data-v="${k}" aria-pressed="${view === k}">${l}</button>`).join("")}</div>`;
    $("#ebar").innerHTML = `<b style="font-size:13px">Your entity</b>${sel.size ? [...sel].map(x => `<span class="chip on">${esc(A.get(x).short || A.get(x).label)}</span>`).join("") : '<span class="tag">nothing picked yet</span>'}<button type="button" class="lnk" id="editent" style="font-size:13px;margin-left:auto">Edit entity</button>`;
  }
  $("#rhead").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) { view = b.dataset.v; store.set("entity.view", view); panel = null; update(); } });

  /* ---------- list and deadlines ---------- */
  function renderList(R, B){
    if (!sel.size) return emptyState(false);
    const sec = b => `<div class="lsec"><h3><span class="dot" style="background:${COL(b.id)}"></span>${esc(b.name)} <span class="tag">${b.count || b.themes.length}</span></h3>
      ${b.id === "combo" ? b.themes.map(t => `<div class="lrow"><div><span class="pill combo-pill">Combination</span> <b>${esc(t.name)}</b></div><div class="bec">Because: ${esc(t.combo._why.join(" + "))}</div><div class="t">${t.combo.adds.map(a => esc(D.inst[a.sec][a.id][0]) + (a.scope ? " · " + esc(a.scope) : "")).join("<br>")}</div></div>`).join("")
      : `<div class="lrow lhead"><div>${b.id === "rulings" ? "Ruling" : "Instrument"}</div><div>${b.id === "rulings" ? "Court and date" : "Applies because"}</div><div class="t">${b.id === "rulings" ? "Topic" : "Subject"}</div></div>` + b.themes.flatMap(t => t.items.map(i => i.ruling
        ? `<div class="lrow"><div><a href="${hrefOf(i)}">${esc(i.name)}</a></div><div class="bec">${esc(i.ruling.court)} · ${fmtDate(i.ruling.date)}</div><div class="t">${esc(i.ruling.topic)}</div></div>`
        : `<div class="lrow"><div><a href="${hrefOf(i)}">${esc(i.name)}</a> ${tierPill(i)}${i.cond.length ? `<span class="sc">Only if you: ${esc(i.cond.join(" or "))}</span>` : ""}${i.scope.length ? `<span class="sc">Applies in part: ${esc(i.scope.join("; "))}</span>` : ""}${i.focus.length ? `<span class="sc">For your activity: ${esc(i.focus.join("; "))}</span>` : ""}</div><div class="bec">${i.via ? "Binds your lender; reaches you by contract" : esc(whyText(i))}${i.also.length ? ` · also in ${esc(i.also.join(", "))}` : ""}</div><div class="t">${esc(t.name)}</div></div>`)).join("")}</div>`;
    return `<div class="list">${B.map(sec).join("")}${hiddenNote(R, B, true)}</div>`;
  }
  function renderDeadlines(R){
    if (!sel.size) return emptyState(false);
    const its = R.items.filter(i => !i.via && i.tl && i.tl.length);
    const by = new Map(); its.forEach(i => { if (!by.has(i.home)) by.set(i.home, []); by.get(i.home).push(i); });
    const n = its.reduce((a, i) => a + i.tl.length, 0);
    return `<div class="dl"><p class="tag" style="margin-top:14px">${n} time limits and filing cycles named in the instruments that apply, as the text states them. Check the paragraph before relying on one.</p>${[...by].map(([s, list]) => `<h3 style="font-size:19px;margin-top:18px;display:flex;gap:10px;align-items:center"><span class="dot" style="background:${COL(s)}"></span>${esc(SEC.get(s).short)}</h3>${list.map(i => `<h4><a href="${hrefOf(i)}">${esc(i.name)}</a></h4><ul>${i.tl.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`).join("")}`).join("")}</div>`;
  }
  function hiddenNote(R, B, inList){
    const shown = new Set(B.map(b => b.id)), miss = D.sections.map(s => s.id).filter(s => !shown.has(s) && HIDE[s]);
    if (!miss.length || !sel.size) return "";
    const txt = miss.length > 2 ? `Not shown: ${miss.map(s => SEC.get(s).short).join(", ")}. Add ${typeOf() ? "a listing, licence or activity" : "a type, listing, licence or activity"} to bring them in.` : miss.length === 1 ? `Not shown: ${SEC.get(miss[0]).short}. Add ${HIDE[miss[0]]} to include it.` : `Not shown: ${miss.map(s => `${SEC.get(s).short} (add ${HIDE[s]})`).join(", ")}.`;
    return inList ? `<p class="tag" style="margin-top:18px">${txt}</p>` : `<div class="hnote">${txt}</div>`;
  }
  function emptyState(map){
    return `<div class="${map ? "empty-map" : "list"}"><div style="padding:${map ? 0 : 40}px 0;text-align:center"><h2>Start with what your entity is</h2><p class="tag">Pick a type on the left, or one of the examples above.</p></div></div>`;
  }

  /* ---------- the mind map: a balanced tree, own SVG, pan and zoom ---------- */
  const ctx = document.createElement("canvas").getContext("2d");
  const tw = (s, px, w = 400) => { ctx.font = `${w} ${px}px Inter, system-ui, sans-serif`; return ctx.measureText(s).width; };
  let vb = null;
  function renderMap(R, B){
    if (!sel.size) return `<div class="mapwrap">${emptyState(true)}</div>`;
    return `<div class="mapwrap" id="mw"><svg class="mm" id="mm" role="img" aria-label="Mind map of the instruments that apply to your entity"><g id="vp"></g></svg>
      <div class="zoom"><button type="button" class="iconbtn" data-z="1.25" aria-label="Zoom in">+</button><button type="button" class="iconbtn" data-z="0.8" aria-label="Zoom out">−</button><button type="button" class="iconbtn" data-z="fit" aria-label="Fit to screen">⤢</button></div>
      <div class="legend"><span><i></i>binds you directly</span>${B.some(b => b.via) ? '<span><i class="d"></i>reaches you through your lender</span>' : ""}${R.combos.length ? '<span><i class="c"></i>added by your combination</span>' : ""}<span class="tag">Click a branch to open it</span></div>
      ${panel ? "" : hiddenNote(R, B, false)}${panel ? drawer(R, panel) : ""}</div>`;
  }
  function drawMap(R, B){
    const svg = $("#mm"); if (!svg) return; const vp = $("#vp"); const NS = "http://www.w3.org/2000/svg";
    const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
    const isOpen = k => open.has(k);
    const ROW = 28, GAP = 12;
    const hOf = b => !isOpen(b.id) ? ROW : b.themes.reduce((a, t) => a + (isOpen(b.id + "|" + t.name) ? Math.max(1, t.items.length) : 1) * ROW, 0);
    const left = [], right = []; let hl = 0, hr = 0;
    B.forEach(b => { const h = hOf(b) + GAP; if (hr <= hl) { right.push(b); hr += h; } else { left.push(b); hl += h; } });
    const gE = el("g", {}, vp), gN = el("g", {}, vp); const now = new Set();
    const curve = (x1, y1, x2, y2, col, dash, w, key) => { const mx = (x1 + x2) / 2; const p = el("path", { d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`, fill: "none", stroke: col, "stroke-width": w, "stroke-opacity": .55, "stroke-dasharray": dash || "" }, gE); if (!seen.has(key)) p.classList.add("new"); };
    const node = (key, label, act) => { const g = el("g", { class: "nd", tabindex: 0, role: "button", "data-k": key, "aria-label": label }, gN); if (!seen.has(key)) g.classList.add("new"); now.add(key); g.addEventListener("click", e => { e.stopPropagation(); act(); }); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } }); return g; };
    const txt = (g, x, y, s, a = {}) => { const t = el("text", Object.assign({ x, y, "dominant-baseline": "central", "font-size": 13 }, a), g); t.textContent = s; return t; };
    const toggle = k => { open.has(k) ? open.delete(k) : open.add(k); draw(); fit(); };
    const cx = 0, cy = 0;
    function side(list, dir){
      const H = list.reduce((a, b) => a + hOf(b) + GAP, 0) - GAP; let y = cy - H / 2;
      list.forEach(b => {
        const h = hOf(b), ry = y + h / 2, col = COL(b.id), dash = b.via ? "6 5" : b.id === "combo" ? "5 4" : "";
        const lbl = b.id === "combo" ? `${b.name}  ${b.themes.length}` : `${b.name}  ${b.count}`;
        const w = tw(lbl, 13.5, 600) + 34, rx = cx + dir * 170, x0 = dir > 0 ? rx : rx - w;
        curve(cx + dir * 115, cy, rx, ry, col, dash, 2.2, "e:" + b.id);
        const g = node("b:" + b.id, `${lbl}. ${isOpen(b.id) ? "Close" : "Open"} branch`, () => toggle(b.id));
        el("rect", { x: x0, y: ry - 15, width: w, height: 30, rx: 15, fill: b.id === "combo" ? "var(--accent-soft)" : "var(--surface)", stroke: col, "stroke-width": 1.6, "stroke-dasharray": dash, class: "hit" }, g);
        el("circle", { cx: x0 + 15, cy: ry, r: 4, fill: col }, g); txt(g, x0 + 25, ry, lbl, { "font-size": 13.5, "font-weight": 600 });
        const end = dir > 0 ? x0 + w : x0;
        if (!isOpen(b.id)) { txt(gN, end + dir * 10, ry, "+", { "text-anchor": dir > 0 ? "start" : "end", "font-size": 15, fill: "var(--muted)" }); y += h + GAP; return; }
        let ty0 = y;
        b.themes.forEach(t => {
          const tk = b.id + "|" + t.name, topen = isOpen(tk), th = (topen ? Math.max(1, t.items.length) : 1) * ROW, ty = ty0 + th / 2, tx = end + dir * 40;
          curve(end, ry, tx - dir * 6, ty, col, dash ? "4 4" : "", 1.5, "e:" + tk);
          const name = short(t.name, 40), cnt = b.id === "combo" ? "" : String(t.items.length);
          const tg = node("t:" + tk, `${t.name}, ${t.items.length}`, () => b.id === "combo" ? (panel = { combo: t.combo.id }, update()) : toggle(tk));
          const fw = b.id === "combo" ? 600 : 500, wN = tw(name, 12.5, fw), wC = cnt ? tw(cnt, 11.5) + 8 : 0, bw = wN + wC + 12;
          const bx = dir > 0 ? tx - 6 : tx - bw + 6;
          el("rect", { x: bx, y: ty - 12, width: bw, height: 24, rx: 7, class: "hit", stroke: panel && panel.combo && t.combo && panel.combo === t.combo.id ? "var(--accent)" : "none" }, tg);
          const t1 = txt(tg, dir > 0 ? tx : tx - wC, ty, name, { "text-anchor": dir > 0 ? "start" : "end", "font-size": 12.5, "font-weight": fw, fill: b.id === "combo" ? "var(--accent-text)" : "var(--ink)" });
          el("title", {}, t1).textContent = t.name;
          if (cnt) txt(tg, dir > 0 ? tx + wN + 8 : tx, ty, cnt, { "text-anchor": dir > 0 ? "start" : "end", "font-size": 11.5, fill: "var(--muted)" });
          if (topen) {
            const ix = tx + dir * (wN + wC + 46);
            t.items.forEach((i, j) => {
              const iy = ty0 + j * ROW + ROW / 2, ik = "i:" + i.k;
              curve(tx + dir * (wN + wC + 6), ty, ix - dir * 6, iy, col, i.via ? "4 4" : "", 1.2, "e:" + ik);
              const nm = short(i.name, 46) + (i.scope && i.scope.length ? " ◐" : "");
              const ig = node(ik, i.name, () => { panel = { item: i.k }; update(); });
              const wi = tw(nm, 12.5) + 12, ibx = dir > 0 ? ix - 6 : ix - wi + 6;
              el("rect", { x: ibx, y: iy - 12, width: wi, height: 24, rx: 7, class: "hit", stroke: panel && panel.item === i.k ? "var(--accent)" : "none" }, ig);
              const t2 = txt(ig, ix, iy, nm, { "text-anchor": dir > 0 ? "start" : "end", "font-size": 12.5, fill: "var(--ink-2)" });
              el("title", {}, t2).textContent = i.name + (i.scope && i.scope.length ? " (applies in part)" : "");
            });
          }
          ty0 += th;
        });
        y += h + GAP;
      });
    }
    function draw(){
      gE.innerHTML = ""; gN.innerHTML = ""; now.clear();
      const L2 = [], R2 = []; let a = 0, c = 0;
      B.forEach(b => { const h = hOf(b) + GAP; if (c <= a) { R2.push(b); c += h; } else { L2.push(b); a += h; } });
      side(R2, 1); side(L2, -1);
      const lines = [...sel].map(x => A.get(x).short || A.get(x).label).slice(0, 6), cw = Math.max(200, ...lines.map(l => tw(short(l, 34), 12) + 30)), ch = 44 + lines.length * 17;
      const g = node("center", "Your entity", () => { $("#bld").scrollIntoView({ behavior: "smooth" }); });
      el("rect", { x: cx - cw / 2, y: cy - ch / 2, width: cw, height: ch, rx: 16, fill: "var(--accent)" }, g);
      txt(g, cx, cy - ch / 2 + 22, "Your entity", { "text-anchor": "middle", "font-size": 15, "font-weight": 700, fill: "var(--accent-ink)" });
      lines.forEach((l, i) => txt(g, cx, cy - ch / 2 + 42 + i * 17, short(l, 34), { "text-anchor": "middle", "font-size": 12, fill: "var(--accent-ink)" }));
      now.forEach(k => seen.add(k)); [...gE.children].forEach(p => {}); B.forEach(b => { seen.add("e:" + b.id); b.themes.forEach(t => { seen.add("e:" + b.id + "|" + t.name); t.items.forEach(i => seen.add("e:i:" + i.k)); }); });
      if (!vb) fit(); else apply();
    }
    const mw = $("#mw");
    function bbox(){ const b = vp.getBBox(); return { x: b.x - 30, y: b.y - 30, w: b.width + 60, h: b.height + 60 }; }
    function fit(){ const W = mw.clientWidth - (panel ? Math.min(400, mw.clientWidth) : 0), H = mw.clientHeight, b = bbox(); const s = Math.max(0.55, Math.min(1.15, W / b.w, H / b.h)); const anim = !!vb; vb = { s, x: (W - b.w * s) / 2 - b.x * s, y: (H - b.h * s) / 2 - b.y * s }; apply(anim); }
    function apply(anim){ vp.style.transition = anim ? "transform .35s ease" : "none"; vp.style.transform = `translate(${vb.x}px,${vb.y}px) scale(${vb.s})`; }
    mw.querySelector(".zoom").addEventListener("click", e => { const z = e.target.closest("[data-z]"); if (!z) return; if (z.dataset.z === "fit") return fit(); const k = +z.dataset.z, W = mw.clientWidth / 2, H = mw.clientHeight / 2; vb.x = W - (W - vb.x) * k; vb.y = H - (H - vb.y) * k; vb.s *= k; apply(true); });
    svg.addEventListener("wheel", e => { if (!e.ctrlKey && !e.metaKey) return; e.preventDefault(); const r = svg.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, k = e.deltaY < 0 ? 1.1 : 0.9; vb.x = mx - (mx - vb.x) * k; vb.y = my - (my - vb.y) * k; vb.s *= k; apply(); }, { passive: false });
    let drag = null;
    svg.addEventListener("pointerdown", e => { if (e.target.closest(".nd")) return; drag = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y }; mw.classList.add("drag"); svg.setPointerCapture(e.pointerId); });
    svg.addEventListener("pointermove", e => { if (!drag) return; vb.x = drag.vx + e.clientX - drag.x; vb.y = drag.vy + e.clientY - drag.y; apply(); });
    svg.addEventListener("pointerup", () => { drag = null; mw.classList.remove("drag"); });
    T = { draw, fit };
    draw();
  }
  function drawer(R, p){
    const close = `<button type="button" class="iconbtn x" data-close aria-label="Close">×</button>`;
    if (p.combo) {
      const c = R.combos.find(x => x.id === p.combo); if (!c) return "";
      return `<aside class="drawer" aria-label="Why it applies">${close}<div class="eyebrow" style="color:var(--accent-text)">Added by your combination</div><h2>${esc(c.title)}</h2>
        <div class="why">Applies because you picked ${c._why.map(w => `<b>${esc(w)}</b>`).join(" and ")}. Each choice alone does not bring these in.</div>
        <ul class="adds">${c.adds.map(a => { const r = D.inst[a.sec][a.id]; return `<li><div class="src"><span class="dot" style="background:${COL(a.sec)}"></span>${esc(SEC.get(a.sec).short)} · ${esc(r[0])}${a.scope ? ", " + esc(a.scope) : ""}</div>${a.note ? esc(a.note) : ""} <a class="lnk" href="../${SEC.get(a.sec).href}#d/${encodeURIComponent(a.id)}">Open</a></li>`; }).join("")}</ul></aside>`;
    }
    const i = R.items.find(x => x.k === p.item); if (!i) return "";
    const sec = SEC.get(i.home);
    return `<aside class="drawer" aria-label="Why it applies">${close}<div class="eyebrow"${i.via ? "" : ` style="color:var(--accent-text)"`}>${i.via ? "Reaches you through your lender" : esc(sec.short) + " · " + esc(i.type)}</div><h2>${esc(i.name)}</h2>
      <div class="why">${i.via ? `<b>${esc(A.get(i.via).label)}</b> is not a licence. This binds the NBFC or HFC you work for, which must make you follow it under your agreement.` : `Applies because: ${[...i.why].map(w => `<b>${esc(w)}</b>`).join(", ")}.`}${i.also.length ? ` Also covered in the ${esc(i.also.join(", "))} section.` : ""}</div>
      <p style="margin:0 0 10px">${tierPill(i, true)}</p>
      ${i.cond.length ? `<p style="font-size:13.5px;margin:0 0 10px"><b>Only if you take up:</b> ${esc(i.cond.join(" or "))}. Your entity type brings it into scope, but its duties bite only on that activity. Add the activity above to see it as applying directly.</p>` : ""}
      ${i.tier === "event" ? `<p style="font-size:13.5px;margin:0 0 10px">A law that applies on a transaction or event: it matters when you sign loan documents, take or enforce security, recover dues, or when a borrower or your company enters insolvency.</p>` : ""}
      ${i.scope.length ? `<p style="font-size:13.5px;margin:0 0 10px"><b>Applies in part:</b> ${esc(i.scope.join("; "))}</p>` : ""}
      ${i.focus.length ? `<p style="font-size:13.5px;margin:0 0 10px"><b>For your activity:</b> ${esc(i.focus.join("; "))}</p>` : ""}
      ${i.notes.length ? `<ul class="adds">${i.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
      ${i.tl && i.tl.length && !i.via ? `<h3 style="font:600 13px var(--f-b);margin:14px 0 4px">Time limits named</h3><ul style="padding-left:18px;margin:0;font-size:13px">${i.tl.slice(0, 6).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      <p style="margin-top:16px"><a class="btn p" style="font-size:13px" href="${hrefOf(i)}">Open in the ${esc(sec.short)} section</a></p></aside>`;
  }
  $("#out").addEventListener("click", e => {
    if (e.target.closest("[data-close]")) { panel = null; update(); return; }
    if (e.target.closest(".drawer")) return;
    if (panel && e.target.closest(".mapwrap") && !e.target.closest(".nd") && !e.target.closest(".zoom")) { panel = null; update(); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && panel) { panel = null; update(); } });

  /* ---------- update cycle ---------- */
  let lastSel = null, lastPanel = null;
  function update(){
    writeHash(); renderBuilder();
    const R = compute(), B = branches(R);
    const key = [...sel].join();
    if (key !== lastSel) { vb = null; open.clear(); const first = B.find(b => b.id === "combo") || B.find(b => b.id === "lender"); if (first) open.add(first.id); lastSel = key; }
    renderHead(R, B);
    $("#out").innerHTML = view === "list" ? renderList(R, B) : view === "dl" ? renderDeadlines(R) : renderMap(R, B);
    if (view === "map" && sel.size) { drawMap(R, B); if (!!panel !== !!lastPanel) T.fit(); }
    lastPanel = panel;
  }
  readHash(); if (phone()) $("#bld").classList.add("fold");
  if (!sel.size && phone()) $("#bld").classList.remove("fold");
  update();
  addEventListener("hashchange", () => { panel = null; readHash(); update(); });
  addEventListener("resize", () => { if (view === "map" && T) T.fit(); });

  /* Counsel's Clerk, answering from the RBI texts (loaded after the page is ready) */
  const rs = hub.sections.find(s => s.id === "rbi");
  if (hub.ai_endpoint && rs) loadSection(rs, "../").then(M => initJudge({ M, endpoint: hub.ai_endpoint, section: "rbi", fulltext: rs.data.fulltext ? "../" + rs.data.fulltext : "", link: id => "../rbi/#d/" + id,
    judUrl: "../judgments/data/judgments.json", judLink: id => "../judgments/#j/" + id,
    scope: "Answers from the RBI texts on this site",
    intro: "Put your question on what an NBFC or HFC must do, and I shall answer from the RBI texts on this site, citing the paragraph. Check what I say.",
    placeholder: "Ask a question, e.g. Must an NBFC that sells insurance get RBI approval?" })).catch(() => {});
})();
</script>
