<style>
.shead{display:flex;align-items:flex-end;gap:24px;padding-top:36px;flex-wrap:wrap}
.shead h1{font-size:clamp(30px,4.4vw,42px);margin-top:8px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:22px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:12px 14px;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}.tabs a.on{color:var(--ink);font-weight:600;border-color:var(--accent)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;margin-top:28px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}
.sc{padding:20px;display:flex;flex-direction:column;gap:10px;min-height:190px;border-top:3px solid var(--c);transition:transform .18s,box-shadow .18s;cursor:pointer}
.sc:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.sc h3{font-size:19px}.sc ul{padding-left:16px;margin:0}.sc li{font-size:13.5px;color:var(--ink-2);margin:3px 0}
.sc .more{margin-top:auto;font-size:12.5px;color:var(--accent-text);font-weight:600}
.layer{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 14px;border-radius:10px;margin:0 auto 6px;font-size:13.5px;cursor:pointer;border:2px solid transparent;background:color-mix(in srgb,var(--c) 15%,transparent);width:100%;text-align:center;transition:transform .15s}
.layer:hover{transform:scale(1.02)}.layer.on{border-color:var(--c)}.layer b{color:color-mix(in srgb,var(--c) 62%,var(--ink))}.layer span{color:var(--ink-2);font-size:12.5px;line-height:1.4}
.panel{padding:20px}
.row{display:flex;gap:14px;align-items:flex-start;padding:14px 4px;border-top:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--surface-2)}.row .t{font-weight:600}.row .m{font-size:12.5px;color:var(--muted)}
.pg h2{font-size:26px;margin-bottom:6px}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.finput{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;background:var(--surface);color:var(--ink);min-width:260px;flex:1;max-width:420px}
/* Direction page */
.dpage{display:grid;grid-template-columns:190px minmax(0,1fr) 300px;gap:36px;margin-top:30px}
.dossier{min-width:0;overflow-wrap:anywhere}.dossier .pill{white-space:normal}
@media (max-width:1100px){.dpage{grid-template-columns:minmax(0,1fr) 280px}.toc{display:none}}
@media (max-width:800px){.dpage{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.ob{flex-direction:column;gap:4px}.ob>span{min-width:0!important;max-width:none!important}.kv{grid-template-columns:1fr}.kv dd{margin-bottom:8px}}
.toc{position:sticky;top:84px;align-self:start}
.toc a{display:block;padding:6px 0 6px 12px;font-size:14px;border-left:2px solid var(--line);color:var(--ink-2)}.toc a:hover,.toc a.on{color:var(--ink);border-color:var(--accent)}
.dossier h2{font-size:22px;margin:34px 0 10px;scroll-margin-top:84px}
.ob{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.ob .pill{height:fit-content;margin-top:2px;flex:0 0 auto;max-width:40%;white-space:normal;overflow-wrap:normal;word-break:normal}.ob>span:last-child{flex:1;min-width:0}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:84px;align-self:start}
@media (max-width:800px){.side{position:static}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.glance{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
@media (max-width:600px){.glance{grid-template-columns:repeat(2,1fr)}}
.glance div{padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.glance b{display:block;font:500 28px var(--f-d);color:var(--accent)}
.callout{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:var(--accent-soft);padding:14px 16px;border-radius:12px;margin-top:18px;font-size:14px}
details.cg summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13.5px;margin-top:10px}
.imp{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}@media (max-width:700px){.imp{grid-template-columns:1fr}}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.offl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}.offl .tag{flex-basis:100%;margin-top:2px}
.tocm{display:none;position:sticky;top:61px;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:14px 0 0;padding:8px 0;gap:6px;overflow-x:auto;scrollbar-width:none}
.tocm a{flex:none;font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;color:var(--ink-2);background:var(--surface)}.tocm a.on{border-color:var(--accent);color:var(--accent-text)}
@media (max-width:1100px){.tocm{display:flex}}
.note{border:1px solid var(--line);background:var(--surface-2);padding:12px 16px;border-radius:12px;margin-top:12px;font-size:14px}
details.defs>summary{cursor:pointer;color:var(--accent-text);font-weight:600;font-size:14px;padding:10px 0}
.hk{font-size:12.5px;font-weight:600;color:var(--ink-2);margin:14px 0 2px}
</style>

<body>
<header id="top"></header>
<main class="wrap">
  <div id="head"></div>
  <div id="view"><p class="tag" style="padding:60px 0">Loading the RBI register…</p></div>
</main>
<footer id="foot"></footer>
<script src="../assets/hub.js?v=20261128w"></script>
<script>
(async function(){
  const hub = await getJSON("../hub.json");
  const sec = hub.sections.find(s => s.id === "rbi");
  renderChrome(hub, { root: "../", active: "rbi", sub: "Reserve Bank of India · NBFC lens", crumb: `<a href="../">Home</a> / <b>RBI</b>` });
  const M = await loadSection(sec, "../");
  $("#asof").textContent = `Register as on ${fmtDate(M.meta.as_of)}`;
  let L = +store.get("layer", "-1");
  const live = () => M.items.filter(it => appliesAt(M, it, L));
  const nMD = M.items.filter(x => x.type === "Master Direction" && x.sc !== "old").length, nAct = M.items.filter(x => x.type === "Act").length;
  const TABS = [["", "Overview"], ["subjects", "Subjects"], ["az", "All instruments A–Z"], ["calendar", "Compliance calendar"], ["changes", "What changed"], ["definitions", "Definitions"], ["penalties", "Penalties"], ["who", "Filter by NBFC layer"]];
  $("#head").innerHTML = `<div class="shead"><div style="flex:1;min-width:280px"><h1>RBI rules for NBFCs and HFCs</h1>
    <p style="color:var(--ink-2);margin:10px 0 0;max-width:720px">${nMD} Master Directions, ${nAct} Acts and the circulars around them, grouped by subject. Pick a subject, a deadline or a term, or filter by NBFC layer.</p></div>
    <a class="btn g" href="map/">${I.map} Open the mind map ${I.ext}</a></div>
    <form class="search" id="qform" role="search" style="margin-top:22px">${I.search}<label class="sr" for="q">Search RBI rules</label><input id="q" type="search" autocomplete="off" placeholder="Search RBI rules, e.g. “co-lending”, “para 38A”, “penal charges”"><span class="kbd">/</span></form>
    <nav class="tabs" id="tabs" aria-label="RBI sections">${TABS.map(([h, t]) => `<a href="#${h}" data-tab="${h}">${t}</a>`).join("")}</nav>`;
  let tmr = 0;
  $("#q").addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(() => { const v = $("#q").value.trim(); if (v.length >= 2) history.replaceState(null, "", "#search/" + encodeURIComponent(v)), route(); }, 220); });
  $("#qform").addEventListener("submit", e => { e.preventDefault(); const v = $("#q").value.trim(); if (v) location.hash = "#search/" + encodeURIComponent(v); });

  const V = $("#view");
  const pillFor = it => it.sc === "old" ? '<span class="pill p-old">Superseded</span>' : /amend/i.test(it.status) ? '<span class="pill p-live">In force · amended</span>' : '<span class="pill p-live">In force</span>';
  const instRow = (it, extra = "") => `<a class="row" href="#d/${it.id}"><div style="flex:1;min-width:0"><div class="t">${esc(it.label)}</div><div class="m">${esc(it.type)}<span class="sep"></span>${esc(layerNote(M, it))}${it.updated ? ` · updated ${fmtDate(it.updated)}` : ""}</div>${extra}</div>${pillFor(it)}</a>`;
  const ukind = u => /draft/i.test(u.kind) ? "draft" : /enforce|penalt/i.test(u.kind) ? "enf" : /amend|direction|notification|circular/i.test(u.kind) ? "amend" : "other";
  const UK = { amend: "Amendments", draft: "Draft proposals", enf: "Enforcement actions", other: "Other news" };
  const layerName = () => L < 0 ? "any layer" : LAYERS[L][1];
  const lensBar = () => `<div class="filter"><span class="tag" style="align-self:center">Showing rules for:</span>${[[-1, "Any layer"], ...LAYERS.map((l, i) => [i, l[1]])].map(([v, t]) => `<button class="chip ${v === L ? "on" : ""}" data-layer="${v}" type="button">${t}</button>`).join("")}</div>`;

  function layerCard(){
    const counts = LAYERS.map((l, i) => M.items.filter(it => appliesAt(M, it, i)).length);
    const desc = ["Below ₹1,000 crore, no public deposits", "Deposit-takers, HFCs, ₹1,000 crore+", "Named by RBI each year", "Empty for now"];
    return `<div class="card panel"><h2 style="font-size:19px;margin:0 0 4px">Which layer are you?</h2><p class="tag" style="margin:0 0 14px">Scale Based Regulation</p>
      ${[3,2,1,0].map(i => `<button type="button" class="layer ${L===i?"on":""}" data-layer="${i}" style="--c:var(--l-${LAYERS[i][2]});width:${100-i*8}%"><b>${LAYERS[i][1]}</b><span>${desc[i]}</span></button>`).join("")}
      <p class="tag" style="margin:10px 0 0">${L < 0 ? "Tap a layer to filter every list on this page. Layers are cumulative: a higher layer also follows the rules for the layers below. A guide only: each rule's own scope decides." : `Selected: <b style="color:var(--ink)">${LAYERS[L][1]}</b>. ${counts[L]} instruments apply, including those for lower layers and rules not tied to a layer. <button class="lnk" data-layer="-1" type="button">Clear</button> · <a class="lnk" href="#who">See the list</a>`}</p></div>`;
  }
  function updCard(u, full){
    const it = M.byId.get(u.instrument);
    const head = `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="pill p-new">${esc(u.kind)}</span><span class="tag">${fmtDate(u.date)}${u.effective ? ` · effective ${fmtDate(u.effective)}` : ""}</span></div>
      <div style="font-weight:600;font-size:${full?17:14}px;margin-top:8px;line-height:1.4">${esc(u.title)}</div>`;
    if (!full) return `<a href="#changes/${encodeURIComponent(u.id)}" style="display:block;padding:12px 0;border-top:1px solid var(--line)">${head}${it ? `<div class="tag">${esc(it.label)}</div>` : ""}</a>`;
    const ents = (M.updMeta.entities || []);
    return `<article class="card panel" id="u-${esc(u.id)}" style="margin-bottom:16px;scroll-margin-top:90px">${head}
      <div class="tag" style="margin-top:6px">${[u.ref ? esc(u.ref) : "", u.url ? `<a class="lnk" href="${esc(u.url)}" target="_blank" rel="noopener">Source ${I.ext}</a>` : "", it ? `<a class="lnk" href="#d/${it.id}">${esc(it.label)}</a>` : ""].filter(Boolean).join(" · ")}</div>
      ${u.applies ? `<p style="font-size:14px;color:var(--ink-2)"><b style="color:var(--ink)">Who it covers.</b> ${esc(u.applies)}</p>` : ""}
      ${(u.changes||[]).length ? `<h3 style="font-size:17px;margin-top:14px">What changed</h3><ul style="padding-left:18px;font-size:14px">${u.changes.map(c => `<li style="margin:6px 0">${esc(c)}</li>`).join("")}</ul>` : ""}
      ${u.impact ? `<h3 style="font-size:17px;margin-top:14px">Impact</h3><div class="imp">${Object.entries(u.impact).map(([k, v]) => `<div style="padding:12px;border:1px solid var(--line);border-radius:12px"><div style="font-weight:600">${esc((ents.find(e => e.key === k) || {}).name || k)}</div><div class="tag" style="color:var(--accent);font-weight:600">${esc(v.level || "")}</div><p style="font-size:13.5px;margin:6px 0 0;color:var(--ink-2)">${esc(v.text || "")}</p></div>`).join("")}</div>` : ""}
      ${(u.actions||[]).length ? `<h3 style="font-size:17px;margin-top:14px">What to do</h3><ol style="padding-left:20px;font-size:14px">${u.actions.map(a => `<li style="margin:5px 0">${esc(a)}</li>`).join("")}</ol>` : ""}</article>`;
  }

  /* ---- views ---- */
  function vOverview(){
    const th = M.themes.filter(t => !t.history);
    return `<div class="cols"><div><div style="display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap"><h2 style="font-size:24px">Browse by subject</h2><span class="tag">${th.length} subjects${L>=0?` · showing what applies to the ${layerName()}`:""}</span></div>
      <div class="grid g3">${th.map((t, i) => { const its = t.items.filter(it => appliesAt(M, it, L)); return `<a class="card sc rise" style="--c:var(--t${t.idx});animation-delay:${.03*i}s" href="#subjects/${t.slug}">
        <div style="display:flex;align-items:baseline;gap:8px"><h3>${esc(t.nice)}</h3><span class="tag" style="margin-left:auto">${its.length}</span></div>
        <ul>${its.slice(0, 3).map(x => `<li>${esc(trunc(x.label, 70))}</li>`).join("")}</ul>${its.length > 3 ? `<span class="more">+ ${its.length - 3} more</span>` : its.length ? "" : `<span class="tag">Nothing specific to this layer</span>`}</a>`; }).join("")}</div>
      ${M.themes.some(t => t.history) ? `<p class="tag" style="margin-top:14px">Looking for an older circular? <a class="lnk" href="#subjects/history">See superseded instruments</a> and what replaced them.</p>` : ""}</div>
      <aside style="display:flex;flex-direction:column;gap:18px">${layerCard()}
        <div class="card panel"><div style="display:flex;align-items:baseline"><h2 style="font-size:19px">What changed this month</h2><a class="lnk tag" style="margin-left:auto" href="#changes">See all</a></div>${(() => { const all = [...M.updates].sort((a, b) => String(b.date).localeCompare(String(a.date))), from = new Date().toISOString().slice(0, 8) + "01", mo = all.filter(u => String(u.date) >= from).sort((a, b) => (b.weight || 1) - (a.weight || 1)); return mo.length ? mo.slice(0, 5).map(u => updCard(u, false)).join("") + (mo.length > 5 ? `<a class="lnk tag" style="display:block;padding-top:10px;border-top:1px solid var(--line)" href="#changes">+ ${mo.length - 5} more this month</a>` : "") : `<p class="tag" style="margin:8px 0 2px">Nothing yet this month. Last two updates:</p>` + all.slice(0, 2).map(u => updCard(u, false)).join(""); })()}</div>
        <div class="card panel"><h3 style="font-size:19px">Prefer the big picture?</h3><p class="tag" style="margin:6px 0 12px">The mind map shows how every Direction, Act and category connects.</p><a class="btn g" href="map/">${I.map} Open the mind map ${I.ext}</a></div>
      </aside></div>`;
  }
  function vSubjects(slug){
    const ths = slug ? M.themes.filter(t => t.slug === slug) : M.themes;
    if (!ths.length) return `<p class="empty">Subject not found.</p>`;
    return `<div class="pg" style="margin-top:28px">${slug ? `<a class="lnk tag" href="#subjects">← All subjects</a>` : ""}${lensBar()}
      ${ths.map(t => { const its = t.items.filter(it => t.history || appliesAt(M, it, L)); return `<section style="margin-top:22px"><h2 style="border-left:4px solid var(--t${t.idx});padding-left:12px">${esc(t.nice)} <span class="tag">${its.length}</span></h2>
        ${its.map(it => instRow(it, it.concepts.length ? `<div class="tag" style="margin-top:4px;color:var(--ink-2)">${esc(trunc(it.concepts.slice(0, 4).join(" · "), 160))}</div>` : "")).join("") || '<p class="empty">Nothing in this subject applies to the selected layer.</p>'}</section>`; }).join("")}</div>`;
  }
  function vAZ(){
    const f = store.get("azf", "all");
    const pred = { all: () => true, md: it => it.type === "Master Direction", act: it => it.type === "Act", other: it => !["Master Direction", "Act", "Superseded instrument"].includes(it.type), old: it => it.sc === "old" }[f] || (() => true);
    const its = M.items.filter(pred).filter(it => f === "old" || appliesAt(M, it, L)).sort((a, b) => a.label.localeCompare(b.label));
    return `<div class="pg" style="margin-top:28px"><h2>All instruments A–Z</h2>${lensBar()}<div class="filter">${[["all","All"],["md","Master Directions"],["act","Acts"],["other","Other instruments"],["old","Superseded"]].map(([k,t]) => `<button class="chip ${f===k?"on":""}" data-azf="${k}" type="button">${t}</button>`).join("")}</div>
      <p class="tag">${its.length} instruments</p>${its.map(it => instRow(it)).join("")}</div>`;
  }
  function vCalendar(){
    const ths = M.themes.filter(t => !t.history);
    let n = 0;
    const body = ths.map(t => { const its = t.items.filter(it => appliesAt(M, it, L) && it.time.length); if (!its.length) return ""; return `<section style="margin-top:26px"><h2 style="border-left:4px solid var(--t${t.idx});padding-left:12px;font-size:22px">${esc(t.nice)}</h2>
      ${its.map(it => { n += it.time.length; return `<div style="padding:14px 0;border-top:1px solid var(--line)"><a class="t lnk" style="font-size:15px" href="#d/${it.id}/deadlines">${esc(it.label)}</a>
        ${it.time.map(x => { const [p, t2] = splitPara(x); return `<div class="ob" style="border:0;padding:6px 0">${p ? `<span class="pill p-grey">${esc(p)}</span>` : `<span class="pill p-grey">•</span>`}<span style="font-size:14px">${esc(t2)}</span></div>`; }).join("")}</div>`; }).join("")}</section>`; }).join("");
    return `<div class="pg" style="margin-top:28px"><h2>Compliance calendar</h2><p class="tag" style="max-width:760px">Every time limit, filing cycle and review period named in the instruments${L>=0?` that apply to the ${layerName()}`:""}. The dates are as the text states them; check the paragraph before relying on one.</p>${lensBar()}<p class="tag" id="calcount"></p>${body}</div>`.replace('<p class="tag" id="calcount"></p>', `<p class="tag">${n} timelines</p>`);
  }
  function vChanges(id){
    const w = M.updMeta;
    setTimeout(() => { if (id) { const el = document.getElementById("u-" + id); if (el) el.scrollIntoView({ behavior: "smooth" }); } }, 60);
    return `<div class="pg" style="margin-top:28px;max-width:900px"><h2 style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">What changed <a class="btn g sm" href="../follow/" style="font-family:var(--f-b)">${I.rss} Follow updates</a></h2><p class="tag">${w.window_from ? `${fmtDate(w.window_from)} to ${fmtDate(w.window_to)}. ` : ""}New Directions, amendments, drafts and enforcement actions, with what each means for Upper Layer NBFCs and HFCs.</p>
      <div style="margin-top:18px">${["amend", "draft", "enf", "other"].map(k => { const a = M.updates.filter(u => ukind(u) === k); return a.length ? `<h3 style="font-size:20px;margin:26px 0 10px">${UK[k]} <span class="tag">${a.length}</span></h3>${a.map(u => updCard(u, true)).join("")}` : ""; }).join("") || '<p class="empty">Nothing new in this period.</p>'}</div></div>`;
  }
  function vDefinitions(){
    const q = store.get("dq", "");
    return `<div class="pg" style="margin-top:28px"><h2>Definitions</h2><p class="tag">${M.defs.length.toLocaleString("en-IN")} terms defined in the Directions, each with its paragraph, plus ${M.gloss.length} plain-language explanations of common jargon.</p>
      <div class="filter"><input class="finput" id="dq" type="search" placeholder="Filter terms, e.g. “public funds”" value="${esc(q)}" aria-label="Filter definitions"></div><div id="dlist"></div></div>`;
  }
  function fillDefs(){
    const q = ($("#dq")?.value || "").trim().toLowerCase();
    const gl = M.gloss.filter(t => !q || [t.term, t.full, ...(t.aka || [])].join(" ").toLowerCase().includes(q)).slice(0, q ? 20 : 12);
    const ds = M.defs.filter(d => !q || d.term.toLowerCase().includes(q)).sort((a, b) => a.term.localeCompare(b.term, "en", { sensitivity: "base" }));
    const lim = q ? 200 : 60;
    $("#dlist").innerHTML = (gl.length ? `<h3 style="font-size:19px;margin:12px 0 4px">Plain-language glossary</h3>${gl.map(t => `<div class="ob"><span style="min-width:130px;font-weight:600">${esc(t.term)}</span><span style="font-size:14px">${t.full ? `<i>${esc(t.full)}.</i> ` : ""}${esc(t.def)} ${(t.see || []).filter(id => M.byId.has(id)).map(id => `<a class="lnk tag" href="#d/${id}">${esc(trunc(M.byId.get(id).label, 40))}</a>`).join(" · ")}</span></div>`).join("")}` : "")
      + `<h3 style="font-size:19px;margin:22px 0 4px">Defined in the Directions <span class="tag">${ds.length}${ds.length > lim ? `, showing ${lim}; type to narrow` : ""}</span></h3>`
      + ds.slice(0, lim).map(d => { const it = M.byId.get(d.id); return `<div class="ob"><span style="min-width:180px;max-width:220px;font-weight:600">${esc(d.term)}</span><span style="font-size:14px;flex:1">${esc(d.def)}<span class="tag" style="display:block;margin-top:3px"><a class="lnk" href="#d/${d.id}/definitions">${esc(it ? it.label : d.id)}</a> · ${esc(d.para)}${d.scope ? ` · ${esc(d.scope)}` : ""}${it && it.sc === "old" ? " · superseded" : ""}</span></span></div>`; }).join("");
  }
  function vPenalties(){
    const its = live().filter(it => it.cons.length);
    const gen = {}; M.items.forEach(it => { if (it.consGen && /RBI Act/.test(it.consGen)) gen[it.consGen] = (gen[it.consGen] || 0) + 1; });
    const common = Object.entries(gen).sort((a, b) => b[1] - a[1])[0];
    return `<div class="pg" style="margin-top:28px"><h2>Penalties and consequences</h2><p class="tag" style="max-width:760px">What a breach can lead to. The general powers under the RBI Act apply to every Direction; ${its.length} instruments also name consequences of their own.</p>${lensBar()}
      ${common ? `<div class="callout" style="margin-bottom:10px"><b>General consequences under the RBI Act, 1934</b><p style="margin:6px 0 0">${esc(stripChecked(common[0]))}</p></div>` : ""}
      ${its.map(it => `<div style="padding:14px 0;border-top:1px solid var(--line)"><a class="lnk" style="font-size:15px" href="#d/${it.id}/breach">${esc(it.label)}</a>${it.cons.map(x => { const [p, t] = splitPara(x); return `<div class="ob" style="border:0;padding:6px 0">${p ? `<span class="pill p-grey">${esc(p)}</span>` : ""}<span style="font-size:14px">${esc(t)}</span></div>`; }).join("")}</div>`).join("")}</div>`;
  }
  function vWho(){
    const its = live();
    return `<div class="pg" style="margin-top:28px"><div class="cols" style="margin-top:0"><div><h2>Filter by NBFC layer</h2><p class="tag" style="margin:2px 0 6px"><a class="lnk" href="../entity/">Hold several licences or roles? See what applies across all regulators →</a></p><p class="tag" style="max-width:700px">${L < 0 ? "Choose a layer to narrow the list to the rules tagged to it. This is a guide, not an applicability opinion: check each rule's own scope." : `${its.length} instruments apply to an NBFC in the ${layerName()}: those tagged to that layer or a lower one, plus Acts and rules that are not tied to a layer.`} Some instruments apply only to certain NBFC types or above a size test; each page says who it covers.</p>
      ${M.themes.filter(t => !t.history).map(t => { const x = t.items.filter(it => appliesAt(M, it, L)); return x.length ? `<section style="margin-top:20px"><h3 style="font-size:19px;border-left:4px solid var(--t${t.idx});padding-left:10px">${esc(t.nice)} <span class="tag">${x.length}</span></h3>${x.map(it => instRow(it)).join("")}</section>` : ""; }).join("")}</div><aside>${layerCard()}</aside></div></div>`;
  }
  function vSearch(raw){
    setTimeout(() => { sxFirst(raw, docs); sxMount($("#sxres"), raw, { root: "../", here: "rbi" }); }, 0);
    if (document.activeElement !== $("#q")) $("#q").value = raw;
    const P = parseQuery(M, raw), docs = rankDocs(M, P, { layer: L < 0 ? undefined : L }), defs = matchDefs(M, P).slice(0, 6);
    return `<div class="pg" style="margin-top:28px"><h2>Results for “${esc(raw)}”</h2>${lensBar()}
      ${P.gl.length ? `<div class="callout"><b>${esc(P.gl[0].term)}</b>${P.gl[0].full ? ` (${esc(P.gl[0].full)})` : ""}: ${esc(P.gl[0].def)}</div>` : ""}
      ${hub.ai_endpoint ? `<p style="margin:14px 0"><button class="btn g" type="button" id="askai">${JUDGE_SVG.replace('class="jsvg"', 'width="22" height="22"')} Ask Counsel’s Clerk about this</button></p>` : ""}
            <h3 style="font-size:19px;margin-top:22px">Instruments <span class="tag">${docs.length}</span></h3>
      <div class="card" style="overflow:hidden;margin-top:8px">${docs.slice(0, 40).map(d => `<a class="res" href="#d/${d.it.id}"><div style="display:flex;align-items:center;gap:12px"><div style="flex:1;min-width:0"><div class="t">${hl(d.it.label, P)} ${d.it.sc === "old" ? '<span class="pill p-old">Superseded</span>' : ""}</div><div class="m">${esc(d.it.type)} · ${esc(M.themeOf.get(d.it.id)?.nice || "")} · ${d.hits.length} matching line${d.hits.length > 1 ? "s" : ""}</div></div><span class="bar"><i style="width:${Math.round(d.rel * 100)}%"></i></span></div>
        ${d.hits.filter(x => x.lab !== "Name").slice(0, 3).map(l => `<div class="s"><b style="font-weight:600">${esc(l.lab)}:</b> ${hl(trunc(l.txt, 260), P)}</div>`).join("")}</a>`).join("") || '<p class="empty" style="padding:16px">No instrument summary matches. See the full-text results below.</p>'}</div>
      ${defs.length ? `<h3 style="font-size:19px;margin-top:22px">Defined terms</h3><div class="card" style="overflow:hidden;margin-top:8px">${defs.map(x => `<a class="res" href="#d/${x.d.id}/definitions"><div class="t">“${esc(x.d.term)}”</div><div class="m">${esc(x.it ? x.it.label : x.d.id)} · ${esc(x.d.para)}</div><div class="s">${hl(x.d.def, P)}</div></a>`).join("")}</div>` : ""}<div id="sxres" style="margin-top:28px"></div></div>`;
  }
  function vDirection(id, anchor){
    const it = M.byId.get(id); if (!it) return `<p class="empty" style="margin-top:30px">Instrument not found. <a class="lnk" href="#">Back to RBI</a></p>`;
    const t = M.themeOf.get(id), defs = M.defs.filter(d => d.id === id), upds = M.updates.filter(u => u.instrument === id), links = M.links.get(id) || [];
    const amd = upds.filter(u => ukind(u) === "amend"), drf = upds.filter(u => ukind(u) === "draft"), enf = upds.filter(u => ukind(u) === "enf"), oth = upds.filter(u => ukind(u) === "other");
    const relName = { supersedes: "Replaces", superseded_by: "Replaced by", migrated_from: "Carried over from", migrated_to: "Carried into", issued_under: "Issued under", cross_references: "Refers to", related: "Related", framework: "Framework" };
    const linkGroups = {}; links.forEach(l => { const k = relName[l.rel] || "Related"; (linkGroups[k] = linkGroups[k] || []).push(l.id); });
    const sections = [["glance", "At a glance"], ["who", "Who it applies to"], ["obligations", "Key obligations"], ["deadlines", "Deadlines"], ["breach", "If you breach it"], ["definitions", "Definitions"], ["related", "Related rules"], ["history", "Change history"], ["text", "Full text"]];
    const lines = (arr, empty) => arr.length ? arr.map(x => { const [p, tx] = splitPara(x); return `<div class="ob">${p ? `<span class="pill p-grey">${esc(p)}</span>` : `<span class="pill p-grey">•</span>`}<span>${esc(tx)}</span></div>`; }).join("") : `<p class="empty">${empty}</p>`;
    const supBy = links.filter(l => l.rel === "superseded_by" || l.rel === "migrated_to").map(l => M.byId.get(l.id));
    setTimeout(() => { if (anchor) { const el = document.getElementById("s-" + anchor); if (el) { if (anchor === "definitions") { const d = $("details.defs"); if (d) d.open = true; } el.scrollIntoView(); } } else $("#tabs").scrollIntoView(); spy(); }, 30);
    $("#tabs").querySelectorAll("a").forEach(a => a.classList.remove("on"));
    return `<div style="margin-top:22px"><span class="tag"><a class="lnk" href="#subjects/${t ? t.slug : ""}">← ${esc(t ? t.nice : "RBI")}</a></span></div>
    <div class="dpage"><nav class="toc" aria-label="On this page"><div class="eyebrow" style="margin-bottom:10px">On this page</div>${sections.map(([a, n]) => `<a href="#d/${id}/${a}" data-sec="${a}">${n}</a>`).join("")}</nav>
    <article class="dossier"><div style="display:flex;gap:8px;flex-wrap:wrap">${pillFor(it)}${amd[0] ? `<span class="pill p-new">Amended ${fmtDate(amd[0].date)}${amd[0].effective ? `, effective ${fmtDate(amd[0].effective)}` : ""}</span>` : ""}<span class="pill p-grey">${esc(it.type)}</span></div>
      <h1 style="font-size:clamp(28px,3.6vw,36px);margin:12px 0 6px">${esc(it.label)}</h1>${it.title !== it.label ? `<div style="color:var(--ink-2)">${esc(it.title)}</div>` : ""}
      <div class="tag" style="margin-top:8px">${[it.ref, it.issue && `Issued ${fmtDate(it.issue)}`, it.updated && `Updated as on ${fmtDate(it.updated)}`].filter(Boolean).map(esc).join('<span class="sep"></span>')}</div>
      ${it.url || it.pdf ? `<div class="offl">${it.url ? `<a class="btn p" href="${esc(it.url)}" target="_blank" rel="noopener">Official RBI text ${I.ext}</a>` : ""}${it.pdf ? `<a class="btn g" href="${esc(it.pdf)}" target="_blank" rel="noopener">PDF ${I.ext}</a>` : ""}<span class="tag">The summary here is a guide. The official text governs.</span></div>` : ""}
      <div id="hubtools"></div><nav class="tocm" aria-label="On this page">${sections.map(([a, n]) => `<a href="#d/${id}/${a}" data-sec="${a}">${n}</a>`).join("")}</nav>
      ${supBy.length ? `<div class="callout">This instrument has been replaced. See ${supBy.map(x => `<a class="lnk" href="#d/${x.id}">${esc(x.label)}</a>`).join(", ")}.</div>` : ""}
      <h2 id="s-glance">At a glance</h2>
      <div class="glance"><div><b>${it.obl.length}</b>key obligations</div><div><b>${it.time.length}</b>deadlines and cycles</div><div><b>${defs.length}</b>defined terms</div><div><b>${links.length}</b>linked rules</div></div>
      ${it.concepts.length ? `<div class="filter" style="margin-top:16px">${it.concepts.map(c => `<a class="chip" href="#search/${encodeURIComponent(c.replace(/\s*\(.*\)$/, ""))}">${esc(c)}</a>`).join("")}</div>` : ""}
      ${amd.length ? `<div class="callout"><b>Recent amendment:</b> ${esc(amd[0].title)}. <a class="lnk" href="#changes/${encodeURIComponent(amd[0].id)}">What it means</a></div>` : ""}
      ${drf.length ? `<div class="note"><b>Draft proposal, not yet in force:</b> ${esc(drf[0].title)}. <a class="lnk" href="#changes/${encodeURIComponent(drf[0].id)}">Details</a></div>` : ""}
      ${enf.length ? `<div class="note"><b>Related enforcement action</b> (${fmtDate(enf[0].date)}): ${esc(enf[0].title)}. This does not change the rule itself. <a class="lnk" href="#changes/${encodeURIComponent(enf[0].id)}">Details</a></div>` : ""}
      <h2 id="s-who">Who it applies to</h2>
      <dl class="kv"><dt>Applies to</dt><dd>${esc(it.applies.join("; ") || "Not stated")}</dd>${it.excluded.length ? `<dt>Does not apply to</dt><dd>${esc(it.excluded.join("; "))}</dd>` : ""}<dt>Layer</dt><dd>${esc(layerNote(M, it))}${M.applyBasis.get(id) ? ` <span class="tag">(${esc(M.applyBasis.get(id))})</span>` : ""}</dd>${it.powers.length ? `<dt>Issued under</dt><dd>${esc(it.powers.join("; "))}</dd>` : ""}</dl>
      <h2 id="s-obligations">Key obligations</h2>${lines(it.obl, "No obligations summarised for this instrument.")}
      <h2 id="s-deadlines">Deadlines</h2>${lines(it.time, "No time limits stated.")}
      <h2 id="s-breach">If you breach it</h2>${lines(it.cons, "This instrument does not name its own consequences; the general powers below apply.")}
      ${it.consGen ? `<details class="cg"><summary>General consequences under the statute</summary><p style="font-size:14px;color:var(--ink-2)">${esc(stripChecked(it.consGen))}</p></details>` : ""}
      <h2 id="s-definitions">Definitions</h2>${defs.length > 8 ? `<details class="defs"><summary>Show all ${defs.length} defined terms</summary><input class="finput" id="ddq" type="search" placeholder="Filter these terms" aria-label="Filter defined terms" style="margin:4px 0 8px">` : ""}<div id="ddl">${defs.length ? defs.map(d => `<div class="ob"><span style="min-width:170px;max-width:210px;font-weight:600">${esc(d.term)}</span><span style="font-size:14px;flex:1">${esc(d.def)} <span class="tag">${esc(d.para)}${d.scope ? ` · ${esc(d.scope)}` : ""}</span></span></div>`).join("") : '<p class="empty">No definitions recorded for this instrument.</p>'}</div>${defs.length > 8 ? "</details>" : ""}
      <h2 id="s-related">Related rules</h2>${Object.keys(linkGroups).length ? Object.entries(linkGroups).map(([k, ids]) => `<div class="ob"><span style="min-width:130px" class="tag">${esc(k)}</span><span class="filter" style="margin:0">${ids.map(x => `<a class="chip" href="#d/${x}">${esc(trunc(M.byId.get(x).label, 50))}</a>`).join("")}</span></div>`).join("") : ""}
      ${it.xrefs.length ? `<div class="ob"><span style="min-width:130px" class="tag">Mentions</span><span style="font-size:14px">${esc(it.xrefs.join("; "))}</span></div>` : ""}
      <h2 id="s-history">Change history</h2><div id="hubver"></div>${[["amend", amd], ["draft", drf], ["enf", enf], ["other", oth]].filter(([, a]) => a.length).map(([k, a]) => `<div class="hk">${UK[k]}</div>${a.map(u => updCard(u, false)).join("")}`).join("")}${it.repeals ? `<div class="ob"><span class="tag" style="min-width:130px">Repeals</span><span style="font-size:14px">${esc(it.repeals)}</span></div>` : ""}
      <div class="ob"><span class="tag" style="min-width:130px">Status</span><span style="font-size:14px">${esc(it.status)}</span></div>
    <h2 id="s-text">Full text</h2><div id="hubtext"></div>
    </article>
    <aside class="side"><div class="card panel"><div class="eyebrow">Subject</div><p style="margin:6px 0 0"><a class="lnk" href="#subjects/${t ? t.slug : ""}">${esc(t ? t.nice : "")}</a></p>${it.dept ? `<div class="eyebrow" style="margin-top:12px">Issued by</div><p style="margin:6px 0 0;font-size:14px">${esc(it.dept)}</p>` : ""}</div>
      <div class="card panel"><a class="btn g" style="width:100%;justify-content:center" href="map/#${id}">${I.map} See it in the mind map ${I.ext}</a>${hub.ai_endpoint ? `<button class="btn g" type="button" id="askabout" style="width:100%;justify-content:center;margin-top:8px">Ask about this Direction</button>` : ""}</div></aside></div>`;
  }
  function spy(){
    const secs = $$(".dossier h2[id]"); if (!secs.length) return;
    const on = () => { let cur = secs[0].id; secs.forEach(s => { if (s.getBoundingClientRect().top < 140) cur = s.id; }); $$(".toc a,.tocm a").forEach(a => a.classList.toggle("on", "s-" + a.dataset.sec === cur)); };
    const dq = $("#ddq"); if (dq) dq.oninput = () => { const q = dq.value.trim().toLowerCase(); $$("#ddl .ob").forEach(r => { r.hidden = q && !r.textContent.toLowerCase().includes(q); }); };
    window.onscroll = on; on();
  }

  /* ---- router ---- */
  function route(){
    const h = decodeURIComponent(location.hash.slice(1)), [a, b, c] = h.split("/");
    window.onscroll = null;
    let html, tab = a || "";
    if (a === "d") html = vDirection(b, c);
    else if (a === "subjects") html = vSubjects(b);
    else if (a === "az") html = vAZ();
    else if (a === "calendar") html = vCalendar();
    else if (a === "changes") html = vChanges(b);
    else if (a === "definitions") html = vDefinitions();
    else if (a === "penalties") html = vPenalties();
    else if (a === "who") html = vWho();
    else if (a === "search") { html = vSearch(h.slice(7)); tab = "-"; }
    else { html = vOverview(); tab = ""; }
    V.innerHTML = html;
    if (a === "d") hubDocMount({ sec, it: M.byId.get(b), id: b, anchor: c });
    if (a !== "d") $$("#tabs a").forEach(x => x.classList.toggle("on", x.dataset.tab === tab));
    if (a !== "search" && document.activeElement !== $("#q")) $("#q").value = "";
    if (a === "definitions") { fillDefs(); $("#dq").addEventListener("input", () => { store.set("dq", $("#dq").value); fillDefs(); }); }
    const ask = $("#askai"); if (ask) ask.addEventListener("click", () => openJudge($("#q").value));
    const ab = $("#askabout"); if (ab) ab.addEventListener("click", () => openJudge(`In ${M.byId.get(b).label}, `));
    if (!["d", "changes", "search"].includes(a) && !c) { const tabs = $("#tabs"); if (a && tabs.getBoundingClientRect().top < 0) tabs.scrollIntoView(); }
  }
  V.addEventListener("click", e => {
    const l = e.target.closest("[data-layer]"); if (l) { L = +l.dataset.layer; store.set("layer", String(L)); route(); return; }
    const f = e.target.closest("[data-azf]"); if (f) { store.set("azf", f.dataset.azf); route(); }
  });
  window.addEventListener("hashchange", route);
  route();
  if (hub.ai_endpoint) initJudge({ M, endpoint: hub.ai_endpoint, judUrl: "../judgments/data/judgments.json", judLink: id => "../judgments/#j/" + id, fulltext: "../" + sec.data.fulltext, link: id => "#d/" + id, scope: "Answers from the RBI texts on this site" });
})();
</script>
</body>
</html>
